name: Build macOS (arm64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build .app
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Package zip
        run: |
          STAGE="dist/InstaMusicDownloader"
          mkdir -p "$STAGE"
          mv dist/InstaMusicDownloader.app "$STAGE/"
          cp "docs/macos-first-run.txt" "$STAGE/Прочти меня — Read me first.txt"
          cd dist
          ditto -c -k --keepParent InstaMusicDownloader "InstaMusicDownloader-${{ github.ref_name }}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: InstaMusicDownloader-macos-arm64
          path: dist/InstaMusicDownloader-*-macos-arm64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InstaMusicDownloader-*-macos-arm64.zip
