<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C90FF"/>
      <stop offset="0.55" stop-color="#7C6FF0"/>
      <stop offset="1" stop-color="#5849D6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="128" y1="0" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="256" height="256" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>
  <g clip-path="url(#round)">
    <ellipse cx="128" cy="10" rx="150" ry="90" fill="url(#sheen)"/>
  </g>

  <!-- download arrow -->
